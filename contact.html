<body>
    <header class="top">

        <div class="cgrid">
            <div class="ccard">

                <p>0300 6169492</p>
                <a class="btn solid outline" href="tel:+923006169492">Call us</a></div>
            <div class="ccard">
                <h3>WhatsApp</h3>
                <p>0300 6169492</p>

                <p>ehaababdullah7@gmail.com</p>

    <!-- Cart + checkout drawer -->

            <h2>Your cart</h2><button class="close" id="closeCart" aria-label="Close cart">×</button></div>

    <script src="js/config.js"></script>
